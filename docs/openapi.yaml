    post:
      tags: [charging]
      operationId: uploadAsset
      summary: Upload a file
      description: |
        For a user who is logged in. The file travels in the body in base64, as `{ content: { name, data }, contentType, isPublic }`, which
        makes it the biggest body that the proxy takes (`http.bodyLimit`). The name, the type and the content are checked, and only those
        fields and `isPublic` are sent on.
