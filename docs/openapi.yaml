      summary: Create an offering in a catalog
      description: |
        Only a seller, for a product of their own that is active or launched, or for a bundle of at least two offerings of their own. The related parties are the caller as the seller, the buyer when the body names one, and the operator; what the body says about the seller is not looked at. Each category has to exist, and the root category of the catalog of another seller is refused. The charging backend checks the offering before it is made and is told after: when it cannot be told the offering is retired and the answer says so. When it is launched at once the requirements of the marketplace apply, if it asks for them. `id` and `href` are dropped.
        
        The catalog has to be one of the caller and active or launched, and its category is added to the offering.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: catalogId
          in: path
          required: true
          description: 'Identifier of the catalog: letters, digits and the marks : . _ -, up to 200 characters.'
          schema:
            type: string
            pattern: '^(?!\.+$)[A-Za-z0-9:._-]{1,200}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: The offering created, as the catalog API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:product-offering:1
        '400':
          $ref: '#/components/responses/InvalidIdOrBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '422':
          description: The offering or what it is made of is not valid, or the charging backend refuses it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
  /catalog/productOffering/{id}:
    get:
      tags: [catalog]
      operationId: getProductOffering
      summary: An offering
      description: |
        Open to anybody, except an offering made for a buyer: only the buyer and the seller see it, and to anybody else it does not exist. The list of offerings is answered by the legacy application.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The offering, as the catalog API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:product-offering:1
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
    patch:
      tags: [catalog]
      operationId: updateProductOffering
      summary: Change an offering
      description: |
        Only the seller who owns it. The related parties, the product and the bundle cannot be changed, and the lifecycle has to follow its order. To launch it the product (or each offering of the bundle) has to be launched, and the requirements of the marketplace apply, if it asks for them. The categories of the catalog of the offering stay whatever the body says. The charging backend is told afterwards; when it cannot be told the answer says that the offering was changed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The offering changed, as the catalog API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:product-offering:1
        '400':
          $ref: '#/components/responses/InvalidIdOrBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '409':
          description: The related parties change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '422':
          description: The offering is not valid, or the charging backend refuses it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
    delete:
      tags: [catalog]
      operationId: retireProductOffering
      summary: Retire an offering
      description: |
        Only the seller who owns it. A delete retires the offering, which stays in the API, and the charging backend is told.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The offering retired, as the catalog API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:product-offering:1
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '409':
          description: The offering is retired already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
  /catalog/productOfferingPrice:
    get:
      tags: [catalog]
      operationId: listProductOfferingPrices
      summary: List of the prices
      description: |
        Open to anybody. Only the filters of the portal are sent on: `limit`, `offset`, `id` (up to a hundred identifiers separated by
        commas), `usageSpecId` and `bundledPopRelationship.id`; any other is refused.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: filters
          in: query
          required: false
          description: '`limit`, `offset`, `id`, `usageSpecId` and `bundledPopRelationship.id`, each once.'
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '200':
          description: The prices, as the catalog API answers them.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
              example: []
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
    post:
      tags: [catalog]
      operationId: createProductOfferingPrice
      summary: Create a price
      description: |
        Only a seller, who is its seller whatever the body says about it; the buyer is kept when the body names one, and the operator
        is added. `id` and `href` are dropped and `validFor` starts now when it is missing. A discount is a percentage from 0 to 100 or a fixed amount that is not negative, a
        unit of measure has an amount of at least one, and a price is between 0,01 and 1.000.000.000 with the decimals of its ISO 4217
        currency.

        A price plan (a bundle) holds components that exist, that are not bundles or constraints and that use nothing that its
        constraint forbids; it points at one constraint at most, and then it applies to no characteristic itself. A constraint
        cannot name a compliance characteristic.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: The price created, as the catalog API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:product-offering-price:1
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The price or what it is made of is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
  /catalog/productOfferingPrice/{id}:
    get:
      tags: [catalog]
      operationId: getProductOfferingPrice
      summary: A price
      description: |
        Open to anybody.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The price, as the catalog API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:product-offering-price:1
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
    patch:
      tags: [catalog]
      operationId: updateProductOfferingPrice
      summary: Change a price
      description: |
        Only the seller who owns it. The related parties cannot be changed, a plan cannot become a component or the other way round,
        and the lifecycle has to follow its order. The amounts keep their rules. A plan that changes what it holds or points at is
        checked as when it is made; a component that changes what it applies to cannot use what the constraint of a plan that holds
        it forbids, and a constraint cannot forbid what the components of the plans that point at it use.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The price changed, as the catalog API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:product-offering-price:1
        '400':
          $ref: '#/components/responses/InvalidIdOrBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '409':
          description: The related parties change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '422':
          description: The price or what it is made of is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: 'Identifier of a user or of an organisation: letters, digits and the marks : . _ -, up to 200 characters.'
      schema:
        type: string
        pattern: '^(?!\.+$)[A-Za-z0-9:._-]{1,200}$'
    ResourceId:
      name: id
      in: path
      required: true
      description: 'Identifier of the resource, for instance a URN: letters, digits and the marks : . _ -, up to 200 characters.'
      schema:
        type: string
        pattern: '^(?!\.+$)[A-Za-z0-9:._-]{1,200}$'
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identifier of the request, used in the logs. Generated when absent.
      schema:
        type: string
  responses:
    InvalidId:
      description: The id is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Invalid id
    InvalidQuery:
      description: A name or a value of the query is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Invalid query
    InvalidBody:
      description: The body is not a JSON object or array.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Invalid body
    InvalidIdOrBody:
      description: The id or the body is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Invalid id
    PayloadTooLarge:
      description: The body is bigger than `http.bodyLimit`, or the upload than `http.uploadLimit`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Upload too large
    UnsupportedMediaType:
      description: The upload is not a multipart body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Unsupported media type
    Forbidden:
      description: The party in the path is not the one of the caller, who is not an administrator either.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: You are not allowed to access the resources of another party
    NotAuthenticated:
      description: Nobody is logged in.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: You need to be authenticated to perform this request
    NotAccountOwner:
      description: The caller is not the owner of the account, or names somebody else as the owner.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: The user making the request is not the specified owner
    NotBillParty:
      description: The caller is not a party of the bill, or asks for the bills in a role that is not theirs to ask for.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: You are not authorized to access the specified bill
    InvalidPhoneNumber:
      description: A telephone of the contacts has no valid number.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Invalid phone number
    NotAllowedParty:
      description: The party is not the one of the caller, the caller does not act as it should, or the instance does not allow to edit parties.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: You are not allowed to access this resource
    InvalidPartyChanges:
      description: A telephone has no valid number, or a country is not a code of two letters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Invalid country code
    NotSpecificationSeller:
      description: The caller is not a seller, or the specification is not theirs, or the body names somebody else as an owner.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Unauthorized to update non-owned/non-seller resource specs
    InvalidSpecification:
      description: The name is missing, empty or too long, or the description is too long, or the deployment definition of a software specification is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Resource spec name is mandatory
    SpecificationConflict:
      description: The related parties would change, the specification is retired already, or a product specification that is not retired uses it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Cannot retire a resource spec without retiring all product specs linked with it
    BadGateway:
      description: What a server behind answered cannot be used, so the proxy cannot check the change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: The resource spec could not be read
    InvalidUpload:
      description: The name of the file has a folder or a control character, the type is not a media type, or the content is not base64.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Invalid file name
    NotAnAdministrator:
      description: The caller is not an administrator.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: You are not allowed to access this resource
    UpstreamNotFound:
      description: The server behind does not know the resource; the body is the one it sends.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
          example:
            error: Not found
    UpstreamUnreachable:
      description: The server behind did not answer in time or cannot be reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error: Service unreachable
  headers:
    RequestId:
      description: Identifier of the request, as it appears in the logs.
      schema:
        type: string
  schemas:
    CartItem:
      type: object
      required: [id]
      description: What the portal keeps of an offering that is to be bought, with the options chosen. Only the `id` is read by the proxy.
      properties:
        id:
          type: string
          pattern: '^(?!\.+$)[A-Za-z0-9:._-]{1,200}$'
      additionalProperties: true
    LifecycleCounts:
      type: object
      required: [Active, Launched, Retired, Obsolete]
      properties:
        Active:
          type: integer
        Launched:
          type: integer
        Retired:
          type: integer
        Obsolete:
          type: integer
    File:
      type: object
      required: [fileId]
      properties:
        fileId:
          type: string
        url:
          type: string
        checksum:
          type: string
        size:
          type: integer
        mimeType:
          type: string
        originalName:
          type: string
        visibility:
          type: string
          enum: [private, public]
    IdentityProvider:
      type: object
      required: [name, server, idpId]
      properties:
        name:
          type: string
        server:
          type: string
        idpId:
          type: string
        issuerDid:
          type: string
        description:
          type: string
    IdentityProviderForm:
      type: object
      additionalProperties: false
      required: [idpId, name, server]
      properties:
        idpId:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,128}$'
        name:
          type: string
        server:
          type: string
          description: An http or https address.
        issuerDid:
          type: string
        description:
          type: string
    IdentityProviderChange:
      type: object
      additionalProperties: false
      required: [name, server]
      properties:
        name:
          type: string
        server:
          type: string
        issuerDid:
          type: string
        description:
          type: string
    BlogEntry:
      type: object
      required: [_id, title, contentType, tags, date, content]
      properties:
        _id:
          type: string
        title:
          type: string
        contentType:
          type: string
          enum: [blog, news, faq]
        slug:
          type: string
        featuredImage:
          type: string
        metaDescription:
          type: string
        excerpt:
          type: string
        author:
          type: string
        partyId:
          type: string
        tags:
          type: array
          items:
            type: string
        date:
          type: string
          format: date-time
        content:
          type: string
    BlogEntryForm:
      type: object
      description: |
        `title` and `content` are needed to make an entry. Texts are trimmed; an optional one that is empty is taken away. Fields that are not here are ignored.
      properties:
        title:
          type: string
          maxLength: 300
        content:
          type: string
        contentType:
          type: string
          enum: [blog, news, faq]
        slug:
          type: string
          description: Lowercase letters and digits separated by hyphens.
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        featuredImage:
          type: string
          description: An http or https address.
        metaDescription:
          type: string
          maxLength: 160
        excerpt:
          type: string
          maxLength: 300
        author:
          type: string
        partyId:
          type: string
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 50
        date:
          type: string
          format: date-time
    AnalyticsConfig:
      type: object
      required: [analytics, analyticsEnabled, analyticsDashboards, analyticsSuperset]
      properties:
        analytics:
          type: string
          description: Where Superset is.
        analyticsEnabled:
          type: boolean
        analyticsDashboards:
          type: object
          required: [businessInsightsNonLear, businessInsightsLear, usageMonitor]
          properties:
            businessInsightsNonLear:
              type: string
            businessInsightsLear:
              type: string
            usageMonitor:
              type: string
        analyticsSuperset:
          type: object
          required: [guestTokenPath]
          properties:
            guestTokenPath:
              type: string
    ErrorResult:
      type: object
      required: [error]
      properties:
        error:
          type: string
    LivenessResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResult:
      type: object
      required: [status, info, error, details]
      properties:
        status:
          type: string
          enum: [ok, error, shutting_down]
        info:
          description: Indicators that are up.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IndicatorResult'
        error:
          description: Indicators that are down.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IndicatorResult'
        details:
          description: Every indicator.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IndicatorResult'
    IndicatorResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        message:
          type: string
