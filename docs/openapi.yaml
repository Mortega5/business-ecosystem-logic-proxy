      description: |
        Only a seller, and the related parties of the body have to be the caller (or the organisation they act for) as the seller
        and nobody else. `id` and `href` of the body are dropped. The name is mandatory, up to 100 characters, and the description
        up to 100.000. A profile picture has to be an SVG, PNG, JPEG or GIF image; the characteristics cannot repeat a name or an
        id, have an empty range or a compliance credential; the plan of orchestration of a blueprint has to be consistent; and a
        bundle has at least two (and at most fifty) products of the caller that are active or launched and are not bundles.

        The charging backend checks the product before it is made, and is told when it was made: when it refuses it the answer
        carries what it said, when the product cannot be made it is told to take it back, and when it cannot be told that the
        product was made the product is retired and the answer says so.
