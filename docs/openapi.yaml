openapi: 3.0.3
info:
  title: Business Ecosystem Logic Proxy
  version: 12.0.0
  description: |
    Endpoints implemented by the Nest application. Requests that match none of them are handled by the
    legacy Express application, whose routes are not described in this document.

    Every response carries an `X-Request-Id` header. The value of the request header of the same name is
    reused when it is present; otherwise a UUID is generated.
tags:
  - name: health
    description: Probes for the container orchestrator.
  - name: document
    description: The TMForum document API, as far as the portal uses it.
  - name: revenue
    description: The revenue sharing service, as far as the portal uses it.
  - name: search
    description: The organisation search, as far as the portal uses it.
  - name: invoicing
    description: The invoicing API, as far as the portal uses it.
  - name: quote
    description: The quote management service, as far as the portal uses it.
  - name: inventory
    description: The product, service and resource inventories, as far as the portal uses them.
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness
      description: Answers 200 while the process is running. It does not check any dependency.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The process is running.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResult'
              example:
                status: ok
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness
      description: |
        Pings MongoDB and waits at most `health.mongoPingTimeoutMs` for the reply. The state is evaluated on
        every call: it is 503 while MongoDB does not reply and 200 again as soon as it does. From the moment
        a termination signal is received it answers 503 with status `shutting_down`, while the server keeps
        accepting requests for `app.shutdownDelayMs`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: MongoDB replied to the ping.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResult'
              example:
                status: ok
                info:
                  mongodb:
                    status: up
                error: {}
                details:
                  mongodb:
                    status: up
        '503':
          description: MongoDB did not reply to the ping in time, or the connection is closed, or the process is shutting down.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResult'
              examples:
                mongodbDown:
                  summary: MongoDB does not reply
                  value:
                    status: error
                    info: {}
                    error:
                      mongodb:
                        status: down
                        message: MongoDB is not reachable
                    details:
                      mongodb:
                        status: down
                        message: MongoDB is not reachable
                shuttingDown:
                  summary: A termination signal was received
                  value:
                    status: shutting_down
                    info:
                      mongodb:
                        status: up
                    error: {}
                    details:
                      mongodb:
                        status: up
  /document/documentSpecification/{id}:
    get:
      tags: [document]
      operationId: getDocumentSpecification
      summary: Document specification
      description: |
        Reads a document specification from the TMForum document API; the portal uses it to download the content of an
        attachment. The user is identified by the bearer token or the session cookie, and the id is passed to the
        upstream as given once it is known to be an id. Any other method or path under `/document` answers 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The specification, as the TMForum server answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:document-specification:7a1c0f3e
                name: Terms of the offering
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
  /revenue/dashboard/{id}:
    get:
      tags: [revenue]
      operationId: getRevenueDashboard
      summary: Revenue dashboard of an organisation
      description: |
        Reads the revenue sharing dashboard of an organisation from the revenue service: a list of sections the portal
        shows to a provider. The user is identified by the bearer token or the session cookie. Any other method or path
        under `/revenue` answers 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The dashboard, as the revenue service answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
              example:
                - label: Subscription
                  text: No active subscription found for this user.
                  link: null
                  items: null
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
  /search-bck/api/searchOrganizations:
    post:
      tags: [search]
      operationId: searchOrganizations
      summary: Search organisations
      description: |
        Searches the organisations with the filters of the body, which goes to the search service as it came, a page at
        a time. The user is identified by the bearer token or the session cookie. Any other method or path under
        `/search-bck` answers 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: page
          in: query
          required: false
          description: Page number, starting at 0.
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          required: false
          description: Number of organisations per page.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        description: The filters, a JSON object; its shape is the search service's.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              categories: [Cloud]
              countries: [ES]
      responses:
        '200':
          description: The page of organisations, as the search service answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                content: []
        '400':
          description: The body is not a JSON object or array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Invalid body
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '413':
          description: The body is bigger than `http.bodyLimit`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: request entity too large
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
