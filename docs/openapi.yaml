        '400':
          $ref: '#/components/responses/InvalidId'
        '403':
          description: The specification is a draft and the caller is not a seller who owns it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Unauthorized to read a resource spec that is not launched
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
    patch:
      tags: [resource]
      operationId: updateResourceSpecification
      summary: Change a resource specification
      description: |
        The specification is read first and only a seller who owns it may change it. The related parties cannot be changed, the
        lifecycle has to follow its order (active, launched, retired, obsolete), and a specification is retired only when every
        product specification that uses it is retired or obsolete. The name and the description are checked as in the creation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The specification changed, as the resource catalog answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:resource-specification:1
        '400':
          $ref: '#/components/responses/InvalidIdOrBody'
