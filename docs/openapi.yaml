        - $ref: '#/components/parameters/RequestId'
        - name: X-Terms-Accepted
          in: header
          required: false
          description: '`true` when the buyer accepted the terms of the offerings, which the charging backend asks for when an offering has them.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The order made, as the ordering API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Redirect-URL:
              description: Where the buyer pays, when the charging backend asks for a payment.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:product-order:1
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: The customer is not the caller, the offering is the caller's own or for another buyer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The billing account is missing, does not exist or is not the caller's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
