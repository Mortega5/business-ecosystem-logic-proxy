openapi: 3.0.3
info:
  title: Business Ecosystem Logic Proxy
  version: 12.0.0
  description: |
    Endpoints implemented by the Nest application. Requests that match none of them are handled by the
    legacy Express application, whose routes are not described in this document.

    Every response carries an `X-Request-Id` header. The value of the request header of the same name is
    reused when it is present; otherwise a UUID is generated.
tags:
  - name: health
    description: Probes for the container orchestrator.
  - name: document
    description: The TMForum document API, as far as the portal uses it.
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness
      description: Answers 200 while the process is running. It does not check any dependency.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The process is running.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResult'
              example:
                status: ok
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness
      description: |
        Pings MongoDB and waits at most `health.mongoPingTimeoutMs` for the reply. The state is evaluated on
        every call: it is 503 while MongoDB does not reply and 200 again as soon as it does. From the moment
        a termination signal is received it answers 503 with status `shutting_down`, while the server keeps
        accepting requests for `app.shutdownDelayMs`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: MongoDB replied to the ping.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResult'
              example:
                status: ok
                info:
                  mongodb:
                    status: up
                error: {}
                details:
                  mongodb:
                    status: up
        '503':
          description: MongoDB did not reply to the ping in time, or the connection is closed, or the process is shutting down.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResult'
              examples:
                mongodbDown:
                  summary: MongoDB does not reply
                  value:
                    status: error
                    info: {}
                    error:
                      mongodb:
                        status: down
                        message: MongoDB is not reachable
                    details:
                      mongodb:
                        status: down
                        message: MongoDB is not reachable
                shuttingDown:
                  summary: A termination signal was received
                  value:
                    status: shutting_down
                    info:
                      mongodb:
                        status: up
                    error: {}
                    details:
                      mongodb:
                        status: up
  /document/documentSpecification/{id}:
    get:
      tags: [document]
      operationId: getDocumentSpecification
      summary: Document specification
      description: |
        Reads a document specification from the TMForum document API; the portal uses it to download the content of an
        attachment. The user is identified by the bearer token or the session cookie, and the id is passed to the
        upstream as given once it is known to be an id. Any other method or path under `/document` answers 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          description: 'Identifier of the specification, for instance a URN: letters, digits and the marks : . _ -, up to 200 characters.'
          schema:
            type: string
            pattern: '^(?!\.+$)[A-Za-z0-9:._-]{1,200}$'
      responses:
        '200':
          description: The specification, as the TMForum server answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:document-specification:7a1c0f3e
                name: Terms of the offering
        '400':
          description: The id is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Invalid id
        '401':
          description: Nobody is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You need to be authenticated to perform this request
        '404':
          description: The server does not know that specification; the body is the one the server sends.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                error: Not found
        '504':
          description: The TMForum server did not answer in time or cannot be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Service unreachable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identifier of the request, used in the logs. Generated when absent.
      schema:
        type: string
  headers:
    RequestId:
      description: Identifier of the request, as it appears in the logs.
      schema:
        type: string
  schemas:
    ErrorResult:
      type: object
      required: [error]
      properties:
        error:
          type: string
    LivenessResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResult:
      type: object
      required: [status, info, error, details]
      properties:
        status:
          type: string
          enum: [ok, error, shutting_down]
        info:
          description: Indicators that are up.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IndicatorResult'
        error:
          description: Indicators that are down.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IndicatorResult'
        details:
          description: Every indicator.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IndicatorResult'
    IndicatorResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        message:
          type: string
