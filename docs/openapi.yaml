  /resource/resourceSpecification/{id}:
    get:
      tags: [resource]
      operationId: getResourceSpecification
      summary: A resource specification
      description: |
        A specification that is launched, retired or obsolete is given to anybody, as the details of a product show its resources;
        a draft (active, or with no status) only to a seller who owns it. It is asked for with the identity of the caller when there
        is one. The query is not sent on. Any other method or path under `/resource` answers 404.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The specification, as the resource catalog answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:resource-specification:1
        '400':
          $ref: '#/components/responses/InvalidId'
        '403':
          description: The specification is a draft and the caller is not a seller who owns it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Unauthorized to read a resource spec that is not launched
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
    patch:
      tags: [resource]
      operationId: updateResourceSpecification
      summary: Change a resource specification
      description: |
        The specification is read first and only a seller who owns it may change it. The related parties cannot be changed, the
        lifecycle has to follow its order (active, launched, retired, obsolete), and a specification is retired only when every
        product specification that uses it is retired or obsolete. The name and the description are checked as in the creation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The specification changed, as the resource catalog answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:resource-specification:1
        '400':
          $ref: '#/components/responses/InvalidIdOrBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/NotSpecificationSeller'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '409':
          $ref: '#/components/responses/SpecificationConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/InvalidSpecification'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
    delete:
      tags: [resource]
      operationId: retireResourceSpecification
      summary: Retire a resource specification
      description: |
        A delete does not remove the specification, it retires it. The same ones that may change it may retire it, and it waits
        until every product specification that uses it is retired or obsolete, as a change of the status does. One that is retired or
        obsolete is not retired again.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The specification retired, as the resource catalog answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:resource-specification:1
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/NotSpecificationSeller'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '409':
          $ref: '#/components/responses/SpecificationConflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
