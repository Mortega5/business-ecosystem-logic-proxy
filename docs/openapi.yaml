openapi: 3.0.3
info:
  title: Business Ecosystem Logic Proxy
  version: 12.0.0
  description: |
    Endpoints implemented by the Nest application. Requests that match none of them are handled by the
    legacy Express application, whose routes are not described in this document.

    Every response carries an `X-Request-Id` header. The value of the request header of the same name is
    reused when it is present; otherwise a UUID is generated.
tags:
  - name: health
    description: Probes for the container orchestrator.
  - name: version
    description: What is running.
  - name: contact-us
    description: The contact form of the portal.
  - name: stats
    description: The figures of the landing page and the counts of an organisation.
  - name: analytics
    description: The dashboards of Superset that the portal embeds.
  - name: blog
    description: The blog, the news and the questions of the marketplace.
  - name: compliance
    description: The compliance certificate of a product and the credential that a certifier uploads for it.
  - name: feedback
    description: The feedback that the portal asks of its visitors.
  - name: auth
    description: The login of the portal and the external identity providers.
  - name: file
    description: The files of the datasets, which the proxy keeps in the file service for the seller who uploaded them.
  - name: config
    description: The settings that the portal reads when it starts.
  - name: payment
    description: How the party of the caller is paid.
  - name: shopping-cart
    description: The shopping cart of the caller.
  - name: document
    description: The TMForum document API, as far as the portal uses it.
  - name: revenue
    description: The revenue sharing service, as far as the portal uses it.
  - name: search
    description: The organisation search, as far as the portal uses it.
  - name: invoicing
    description: The invoicing API, as far as the portal uses it.
  - name: quote
    description: The quote management service, as far as the portal uses it.
  - name: inventory
    description: The product, service and resource inventories, as far as the portal uses them.
  - name: account
    description: The billing accounts of the caller, as far as the portal uses them.
  - name: billing
    description: The bills of the caller and the rates applied to them, as far as the portal uses them.
  - name: party
    description: The organisations and individuals, as far as the portal uses them.
  - name: resource
    description: The resource specifications, as far as the portal uses them.
  - name: service
    description: The service specifications, as far as the portal uses them.
  - name: charging
    description: The charging backend, as far as the portal uses it.
  - name: software
    description: The software specifications and their support packages, as far as the portal uses them.
  - name: usage
    description: The usage specifications of a seller, as far as the portal uses them.
  - name: ordering
    description: The product orders, as far as the portal uses them.
  - name: catalog
    description: The catalog API, as far as it has been moved here (the categories); the rest of it is answered by the legacy application.
paths:
  /version:
    get:
      tags: [version]
      operationId: getVersion
      summary: What is running
      description: Open to anybody. The version of the package, the commit it was built from when the build says so (`BAE_GIT_HASH`, empty otherwise) and how long the process has been up.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The version.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [version, uptime, git_hash]
                properties:
                  version:
                    type: string
                  uptime:
                    type: string
                  git_hash:
                    type: string
              example:
                version: 12.0.0
                uptime: 0 d, 1 h, 2 m, 3 s
                git_hash: ''
  /contact-us:
    post:
      tags: [contact-us]
      operationId: sendContactForm
      summary: Send the contact form
      description: |
        Open to anybody. The body is what the contact form of the portal sends and nothing else (any other field answers 400):
        the names, the organisation and the role (up to `limits.nameLength` characters), a valid email, the message (up to
        `limits.noteLength`) and `privacyAccepted`, which must be `true`. The notification, with everything the visitor wrote
        escaped, goes to the address that the marketplace has for it, or to the charging backend. When it cannot be delivered
        the answer is 502.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, organization, roleInOrganization, message, privacyAccepted]
              additionalProperties: false
              properties:
                supportType:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                organization:
                  type: string
                roleInOrganization:
                  type: string
                message:
                  type: string
                privacyAccepted:
                  type: boolean
                  enum: [true]
                marketingAccepted:
                  type: boolean
      responses:
        '200':
          description: The notification was delivered.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent:
                    type: boolean
              example:
                sent: true
        '400':
          description: The body is not a JSON object, or it is not the contact form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Invalid contact form
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          description: The notification could not be delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The message could not be sent
  /stats:
    get:
      tags: [stats]
      operationId: getStats
      summary: The figures of the landing page
      description: |
        Open to anybody. The names of the launched offerings and of the organisations that sell them. They are kept with the date they were read, and when they are older than `stats.ttlMs` the answer is still what is kept while the proxy reads them again in the background. Until they have been read once the lists are empty.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The figures that are kept.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [services, organizations]
                properties:
                  services:
                    type: array
                    items:
                      type: string
                  organizations:
                    type: array
                    items:
                      type: string
              example:
                services: [Weather API, Maps API]
                organizations: [Acme]
  /stats/provider/{organizationId}:
    get:
      tags: [stats]
      operationId: getProviderStats
      summary: Count what an organisation has, by lifecycle status
      description: |
        For the members of the organisation and for the administrators. How many product offerings, catalogs, product, service, resource and usage specifications the organisation is a party of, in each lifecycle status. The counts are kept in memory for `stats.providerTtlMs`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: organizationId
          in: path
          required: true
          description: 'Identifier of an organisation: letters, digits and the marks : . _ -, up to 200 characters.'
          schema:
            type: string
            pattern: '^(?!\.+$)[A-Za-z0-9:._-]{1,200}$'
      responses:
        '200':
          description: The counts of each collection.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [productOffering, catalog, productSpecification, serviceSpecification, resourceSpecification, usageSpecification]
                additionalProperties:
                  $ref: '#/components/schemas/LifecycleCounts'
              example:
                productOffering: { Active: 1, Launched: 3, Retired: 0, Obsolete: 0 }
                catalog: { Active: 0, Launched: 1, Retired: 0, Obsolete: 0 }
                productSpecification: { Active: 2, Launched: 3, Retired: 1, Obsolete: 0 }
                serviceSpecification: { Active: 0, Launched: 0, Retired: 0, Obsolete: 0 }
                resourceSpecification: { Active: 0, Launched: 0, Retired: 0, Obsolete: 0 }
                usageSpecification: { Active: 1, Launched: 0, Retired: 0, Obsolete: 0 }
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: One of the APIs that were asked did not answer a list, or has more items than `limits.readAll` reads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: /productOffering could not be read (http 500)
  /shoppingCart/item:
    get:
      tags: [shopping-cart]
      operationId: getCartItems
      summary: The items of the shopping cart of the caller
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The items, as the portal sent them.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItem'
              example:
                - id: urn:ngsi-ld:product-offering:1
                  name: Weather API
        '401':
          $ref: '#/components/responses/NotAuthenticated'
    post:
      tags: [shopping-cart]
      operationId: addCartItem
      summary: Add an item to the shopping cart of the caller
      description: |
        The item is kept as it comes and is known by its `id`, which is the one of the offering. The cart of a user holds at most `limits.cartItems` items and each `id` once. The `location` header is the address of the item.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItem'
            example:
              id: urn:ngsi-ld:product-offering:1
              name: Weather API
      responses:
        '201':
          description: The item is in the cart.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: The address of the item.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
              example:
                status: ok
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '409':
          description: The item is already in the cart, or the cart is full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: This item is already in your shopping cart
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /shoppingCart/item/{id}:
    delete:
      tags: [shopping-cart]
      operationId: removeCartItem
      summary: Remove an item from the shopping cart of the caller
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: The item is no longer in the cart.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          description: The item was not in the cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The given ordering item cannot be deleted since it was not present in your cart
  /shoppingCart/empty:
    post:
      tags: [shopping-cart]
      operationId: emptyCart
      summary: Remove every item from the shopping cart of the caller
      description: The body, if there is one, is not read.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: The cart is empty.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
  /paymentInfo:
    get:
      tags: [payment]
      operationId: getPaymentInfo
      summary: How the party of the caller is paid
      description: |
        For who is logged in. With the DPAS payment gateway (`purchase.paymentProvider`) it asks the gateway how many payment gateways the party has, and for the address where the party manages them, which carries a token of the party when the gateway gives one and the id of the party when it does not; it answers 403 when the user has no party. With any other provider there is one gateway and no address.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The payment gateways of the party.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [gatewaysCount, providerUrl]
                properties:
                  gatewaysCount:
                    type: integer
                  providerUrl:
                    type: string
                    nullable: true
              example:
                gatewaysCount: 2
                providerUrl: https://pay.example.org/provider-admin/#/login?productProviderToken=abc
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '502':
          description: The payment gateway did not answer, or did not answer a count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The payment gateway could not be reached
  /file:
    post:
      tags: [file]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      operationId: uploadFile
      summary: Upload a file
      description: |
        Only for sellers, and only while the datasets are on and there is a file service (`datasets.enabled`, `fileService.enabled`); otherwise 404. A `multipart/form-data` body with an optional `visibility` field (`private`, the default, or `public`) and then one part `file`, which has to come last. The file is streamed to the file service, labelled with the party that uploads it, and never kept by the proxy. It may be as large as `fileService.maxSizeMb`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                visibility:
                  type: string
                  enum: [private, public]
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: The file the file service made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          description: The body is not a multipart body, has other parts than `visibility` and `file`, or has no file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The request has no part "file"
        '401':
          description: Nobody is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You need to be authenticated to perform this request
        '403':
          description: The caller is not a seller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You need the seller role to manage files
        '404':
          description: The datasets are off, or there is no file service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Files are not enabled in this marketplace
        '413':
          description: The file is larger than `fileService.maxSizeMb`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The file is larger than the 104857600 bytes allowed
        '422':
          description: The visibility is not `private` or `public`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: 'The visibility of a file must be one of: private, public'
        '502':
          description: The file service did not answer, or answered something that is not for the client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The file service is not reachable
  /file/{id}:
    get:
      tags: [file]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          description: The id the file service gave the file.
          schema:
            type: string
      operationId: getFile
      summary: A file of the seller
      description: Only for sellers. A file of another party is answered as one that does not exist.
      responses:
        '200':
          description: The file, without the labels that the proxy gave it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '401':
          description: Nobody is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You need to be authenticated to perform this request
        '403':
          description: The caller is not a seller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You need the seller role to manage files
        '404':
          description: There is no such file, or it is another party's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The file does not exist
        '502':
          description: The file service did not answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The file service is not reachable
    put:
      tags: [file]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          description: The id the file service gave the file.
          schema:
            type: string
      operationId: replaceFile
      summary: Replace the bytes of a file
      description: Only for sellers, and only a file of their own. A `multipart/form-data` body with one part `file`, streamed to the file service.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The file with its new bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          description: The body is not a multipart body with one file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The request has no part "file"
        '401':
          description: Nobody is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You need to be authenticated to perform this request
        '403':
          description: The caller is not a seller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You need the seller role to manage files
        '404':
          description: There is no such file, or it is another party's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The file does not exist
        '413':
          description: The file is larger than `fileService.maxSizeMb`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The file is larger than the 104857600 bytes allowed
        '502':
          description: The file service did not answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The file service is not reachable
    delete:
      tags: [file]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          description: The id the file service gave the file.
          schema:
            type: string
      operationId: deleteFile
      summary: Remove a file
      description: Only for sellers, and only a file of their own.
      responses:
        '204':
          description: The file is gone.
        '401':
          description: Nobody is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You need to be authenticated to perform this request
        '403':
          description: The caller is not a seller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You need the seller role to manage files
        '404':
          description: There is no such file, or it is another party's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The file does not exist
        '502':
          description: The file service did not answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The file service is not reachable
  /file/{id}/content:
    get:
      tags: [file]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          description: The id the file service gave the file.
          schema:
            type: string
      operationId: getFileContent
      summary: The bytes of a file
      description: |
        Only for sellers, and only a file of their own. The bytes are streamed as the file service sends them, with `Range`, `If-Range` and `If-None-Match` passed on and the headers that describe the content (type, length, range, disposition, `ETag`, digest and cache headers) given back.
      responses:
        '200':
          description: The whole file.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '206':
          description: The part of the file that was asked for.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '304':
          description: The file has not changed.
        '401':
          description: Nobody is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You need to be authenticated to perform this request
        '403':
          description: The caller is not a seller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You need the seller role to manage files
        '404':
          description: There is no such file, or it is another party's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The file does not exist
        '416':
          description: The range cannot be given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The file service answered 416
        '502':
          description: The file service did not answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The file service is not reachable
  /logintoken:
    get:
      tags: [auth]
      operationId: getLoginToken
      summary: The profile of who is logged in
      description: |
        For the portal, which has to call the API with the token of who logged in. It answers the whole profile, the access token and the refresh token included. A portal of another site may send the cookie of the session when its origin is one of `http.cors.origins`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                type: object
                required: [id, accessToken]
                properties:
                  id:
                    type: string
                  accessToken:
                    type: string
        '401':
          description: Nobody is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: 'You need to be authenticated to perform this request'
  /auth/{idp}/callback:
    get:
      tags: [auth]
      operationId: finishLogin
      summary: Where an identity provider sends the user back to
      description: |
        Finishes a login. `idp` is the name of the main provider (`keycloak`, `fiware`...) or the id of an external one. The `state` has to be one the session started and is good for one try. It answers a redirect: to the portal when it works, and to `/error` when it does not. `/login` and `/login/{idp}` start the login, and `/logOut` ends the session; they redirect and are not described here.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: idp
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: To the portal, or to `/error` when the login could not be completed.
          headers:
            Location:
              schema:
                type: string
        '404':
          description: There is no such identity provider.
          content:
            application/json:
              schema:
