  /catalog/catalog/{catalogId}/productOffering:
    get:
      tags: [catalog]
      operationId: listProductOfferingsOfCatalog
      summary: List of the offerings of a catalog
      description: |
        The offerings that the caller may read, as the catalog API pages them (`X-Total-Count` is the one of the API). Open to anybody. An
        offering made for a buyer is for the buyer and the seller only: unless `relatedParty.id` is the caller, the query leaves out the
        offerings that name a buyer, whatever the client asks about `relatedParty.role*`, and one that the API lets through is dropped.

        When the marketplace has a search engine and the query has a `keyword` or a `category.id`, the engine pages and sorts and gives
        the ids, which are then asked of the API in its order (`lifecycleStatus` and the other filters are not applied to them, as in
        v11). A `category.id` is then an id or a filter of the engine written `name::value`. Without an engine a keyword is refused
        (501), as a list that ignored it would look like its answer, and the categories are ids.

        The offerings are the ones with a category of the catalog; a catalog with no categories has no offerings (v11 listed all of
        them). The catalog has to exist (422).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: catalogId
          in: path
          required: true
          description: 'Identifier of the catalog: letters, digits and the marks : . _ -, up to 200 characters.'
          schema:
            type: string
            pattern: '^(?!\.+$)[A-Za-z0-9:._-]{1,200}$'
        - name: filters
          in: query
          required: false
          description: |
            `limit`, `offset`, `sort`, `lifecycleStatus` (several, separated by commas), `isBundle`, `category.id`, `name*` (a regular
            expression), `keyword`, `relatedParty.id`, `relatedParty.role`, `productOfferingPrice.id`, `productSpecification.id` and
            `id`, each once; any other is refused.
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '200':
          description: The offerings, as the catalog API answers them.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
              example: []
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '422':
          description: The catalog cannot be read or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '501':
          description: A keyword was asked for and the marketplace has no search engine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
    post:
      tags: [catalog]
      operationId: createProductOfferingInCatalog
      summary: Create an offering in a catalog
      description: |
        Only a seller, for a product of their own that is active or launched, or for a bundle of at least two offerings of their own. The related parties are the caller as the seller, the buyer when the body names one, and the operator; what the body says about the seller is not looked at. Each category has to exist, and the root category of the catalog of another seller is refused. The charging backend checks the offering before it is made and is told after: when it cannot be told the offering is retired and the answer says so. When it is launched at once the requirements of the marketplace apply, if it asks for them. `id` and `href` are dropped.
        
        The catalog has to be one of the caller and active or launched, and its category is added to the offering.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: catalogId
          in: path
          required: true
          description: 'Identifier of the catalog: letters, digits and the marks : . _ -, up to 200 characters.'
          schema:
            type: string
            pattern: '^(?!\.+$)[A-Za-z0-9:._-]{1,200}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: The offering created, as the catalog API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:product-offering:1
        '400':
          $ref: '#/components/responses/InvalidIdOrBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '422':
          description: The offering or what it is made of is not valid, or the charging backend refuses it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
  /catalog/productOffering/{id}:
    get:
      tags: [catalog]
      operationId: getProductOffering
      summary: An offering
      description: |
        Open to anybody, except an offering made for a buyer: only the buyer and the seller see it, and to anybody else it does not exist. The list of offerings is answered by the legacy application.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The offering, as the catalog API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:product-offering:1
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
    patch:
      tags: [catalog]
      operationId: updateProductOffering
      summary: Change an offering
      description: |
        Only the seller who owns it. The related parties, the product and the bundle cannot be changed, and the lifecycle has to follow its order. To launch it the product (or each offering of the bundle) has to be launched, and the requirements of the marketplace apply, if it asks for them. The categories of the catalog of the offering stay whatever the body says. The charging backend is told afterwards; when it cannot be told the answer says that the offering was changed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The offering changed, as the catalog API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:product-offering:1
        '400':
          $ref: '#/components/responses/InvalidIdOrBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '409':
          description: The related parties change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '422':
          description: The offering is not valid, or the charging backend refuses it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
    delete:
      tags: [catalog]
      operationId: retireProductOffering
      summary: Retire an offering
      description: |
        Only the seller who owns it. A delete retires the offering, which stays in the API, and the charging backend is told.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The offering retired, as the catalog API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:product-offering:1
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '409':
          description: The offering is retired already.
          content:
