  /analytics/guest-token:
    post:
      tags: [analytics]
      operationId: createAnalyticsGuestToken
      summary: The token to embed a dashboard of the analytics
      description: |
        For who is logged in. The proxy asks Superset for a guest token with the access token of the caller, and answers it with the id of the dashboard. The dashboard depends on the tab and on the role: `businessInsights` is the Lear dashboard for an organisation administrator and the non-Lear one for anybody else; `usageMonitor` is only for administrators.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tab]
              properties:
                tab:
                  type: string
                  enum: [businessInsights, usageMonitor]
      responses:
        '200':
          description: The dashboard and the guest token.
          content:
            application/json:
              schema:
                type: object
                required: [dashboardId, token]
                properties:
                  dashboardId:
                    type: string
                  token:
                    type: string
        '400':
          description: The body is not JSON, or the tab is not one of the two.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: A valid tab is required
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: The analytics are off, the caller is not an administrator and asked for the usage monitor, or has no access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Analytics is disabled
        '500':
          description: There is no dashboard for the case, or Superset is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Analytics dashboard is not configured
        '502':
          description: Superset refused, could not be reached, or gave no token. What it said is not repeated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: It was not possible to generate the analytics guest token
        '504':
          description: Superset did not answer within `analytics.timeoutMs`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The analytics service did not answer in time
  /config/analytics:
    get:
      tags: [analytics]
      operationId: getAnalyticsConfig
      summary: The settings of the analytics
      description: |
        Only for administrators, because where Superset is decides where the token of every user who asks for a dashboard goes. The settings that an administrator saved win over the ones of the configuration.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsConfig'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: The caller is not an administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You are not allowed to access this resource
    patch:
      tags: [analytics]
      operationId: updateAnalyticsConfig
      summary: Save the settings of the analytics
      description: |
        Only for administrators. All the fields are sent. `analytics` has to be an http or https address with no user, query or fragment, the ids of the dashboards only letters, digits and `. _ : -`, and `guestTokenPath` an absolute path with no dot segments.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsConfig'
      responses:
        '200':
          description: The settings, as they are now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsConfig'
        '400':
          description: The body is not valid; the message says everything that is wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: 'Invalid analytics config payload: analyticsEnabled is required and must be a boolean'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: The caller is not an administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You are not allowed to access this resource
        '502':
          description: The settings could not be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The analytics settings could not be saved
  /compliance/certificate:
    post:
      tags: [compliance]
      operationId: requestComplianceCertificate
      summary: Ask for the compliance certificate of a product
      description: |
        Only while the compliance is on (`compliance.enabled`; otherwise 404), and only for the seller of the product. The body is the product specification as the portal has it, but only its `id` is read: the product, its seller organisation and the files it names (the values of its `Compliance:*` characteristics, except the credential) are the ones TMForum has. The files are read from their addresses, which have to be public http or https addresses (and at one of `compliance.fileOrigins` when that is set), at most `compliance.maxFiles` of them and `compliance.maxFileMb` MB each, and are sent with the data of the seller to the compliance service, with the access token of the caller. The answer is the one of the compliance service.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        '200':
          description: What the compliance service answers.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: The body is not an object with the id of a product specification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Invalid product specification
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: The caller has no party, or is not the seller of the product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You are not the seller of the product specification
        '404':
          description: The product, or its seller organisation, does not exist; or the compliance is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The product specification does not exist
        '413':
          description: One of the files is larger than `compliance.maxFileMb`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The compliance file 1 is too large
        '422':
          description: The product names more files than allowed, or a file at an address that cannot be used (not public, not http or https, with credentials, redirecting, or at an origin that is not allowed); or the compliance service refuses the request, and says why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The compliance file 1 is not at a public address
        '502':
          description: TMForum, the compliance service or the address of a file failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The compliance service failed
        '503':
          description: There is no compliance service configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The compliance service is not configured
        '504':
          description: The compliance service did not answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Compliance server unreachable
  /admin/uploadcertificate/{specId}:
    patch:
      tags: [compliance]
      operationId: uploadComplianceCredential
      summary: Put the compliance credential in a product
      description: |
        Only while the compliance is on (`compliance.enabled`; otherwise 404). For administrators, for whoever has the role of certifier (`compliance.certifierRole`) and for the members of an organisation that has it. The credential becomes the characteristic `Compliance:VC` of the product, in place of the one it had, and is checked when the product is launched. It has to be a signed token (JWT) of at most 64 KB. Sellers cannot write that characteristic themselves.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: specId
          in: path
          required: true
          description: The id of the product specification.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vc]
              properties:
                vc:
                  type: string
      responses:
        '200':
          description: The credential is in the product.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
        '400':
          description: The body has no credential, or the id is not one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Missing VC
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: The caller is not an administrator or a certifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: You are not authorized to upload certificates
        '404':
          description: The product does not exist, or the compliance is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The product spec does not exist
        '422':
          description: The credential is not a signed token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The credential has to be a signed token (JWT)
        '502':
          description: The catalog failed to give the product or to take the credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The credential could not be saved in the product specification
  /auth/vc/request.jwt:
    get:
      tags: [auth]
      operationId: getVcRequestObject
      summary: The request that the wallet asks for
      description: |
        Only with the login with credentials on (`auth.vc.enabled`) and `auth.vc.isRedirection`; otherwise 404. The signed request (a JWT, signed with the key of the proxy) that tells the verifier and the wallet what the proxy asks of the user. Open: it is what the verifier fetches.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The signed request.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: The login with credentials is off, or the user does not come back to the proxy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Not found
  /auth/vc/callback:
    get:
      tags: [auth]
      operationId: finishVcLogin
      summary: Where the verifier sends the user, or tells the proxy the code
      description: |
        Only with the login with credentials on; otherwise 404. With `isRedirection` the user's browser comes back with a `code` and a `state`: it answers a redirect to the portal when the login works, and to `/error` when it does not. Without it the verifier tells the proxy the code of a user whose wallet is on another device, and the browser asks for the answer at `/poll`; a `state` that starts with `cert:` is the upload of a certificate, whose credential is read at once and given at `/cert/poll`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: state
          in: query
          description: What the portal made up for this login, up to 200 letters, digits and `. _ ~ : -`.
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The code is kept for the browser that waits for it.
        '302':
          description: The user is sent to the portal, or to `/error` when the login could not be completed.
          headers:
            Location:
              schema:
                type: string
        '400':
          description: The `state` or the `code` is missing or has a form that cannot be one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: 'Missing required param: state and code'
        '404':
          description: The login with credentials is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Not found
        '500':
          description: The verifier did not give a token for the code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Error loading VC
  /poll:
    get:
      tags: [auth]
      operationId: pollVcLogin
      summary: Whether the user has shown the credential
      description: |
        Only with the login with credentials on and without `isRedirection`; otherwise 404. The portal asks every second. The browser that asks first about a `state` is the only one that gets its answer (`auth.vc.bindPollToSession`), so the session cookie has to reach the proxy in each question. A 401 means that the user has not shown the credential yet; a 200 sets the session of the browser; a 400 or a 500 means that the login failed.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The browser is logged in.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: There is no code yet, or the state is not one this browser may ask about.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: No auth code received yet
        '404':
          description: The login with credentials is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Not found
        '500':
          description: The code could not be exchanged, or the credential is not one that can log in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The login could not be completed
  /cert/poll:
    get:
      tags: [auth]
      operationId: pollVcCertificate
      summary: The credential of a certification that the user showed
      description: |
        Only with the login with credentials on and without `isRedirection`; otherwise 404. For the `state` of an upload that started with `cert:`. The credential has to be signed by the verifier, issued by one of `auth.vc.certIssuers`, not expired, and say the product and the compliance it certifies.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The credential and what it says.
          content:
            application/json:
              schema:
                type: object
                required: [vc, subject]
                properties:
                  vc:
                    type: string
                  subject:
                    type: object
        '400':
          description: The state is missing, or the credential is not valid, not from a trusted issuer, expired, or not about a product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Invalid VC issuer
        '401':
          description: There is no credential for the state yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: VC not found
        '404':
          description: The login with credentials is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Not found
  /feedback:
    post:
      tags: [feedback]
      operationId: sendFeedback
      summary: Send feedback about the marketplace
      description: |
        Open to anybody. Only the rating, the kind and the comment are kept; the id and the date are the proxy's. The rating is a whole number from 1 to 5; the kind is as long as a name may be (`limits.nameLength`) and the comment as a note (`limits.noteLength`).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                type:
                  type: string
                description:
                  type: string
            example:
              rating: 4
              type: campaign
              description: Nice
      responses:
        '200':
          description: The feedback that was kept.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [id, rating, creation_date]
                properties:
                  id:
                    type: string
                  rating:
                    type: integer
                  type:
                    type: string
                  description:
                    type: string
                  creation_date:
                    type: string
                    format: date-time
              example:
                id: 4f2c3d1e-6c1a-4a3b-9a55-0c9c8d7f1e22
                rating: 4
                type: campaign
                description: Nice
                creation_date: '2026-11-24T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /config:
    get:
      tags: [config]
      operationId: getPortalConfig
      summary: The settings that the portal reads when it starts
      description: |
        Open to anybody, since the portal reads it before the user has logged in. It has the roles, the links and the settings of the deployment (`portal.*`), the features that are on, the default catalog and the system categories, whether there is a search engine, and the filters of the search that the administrator saved. Whatever the deployment sets in `portal.extra` goes on as it is, with the object `roles` completed by it, and a key that the proxy sets itself is never taken from there. The routes of the administrator under `/config` are not described here yet.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The settings.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [roles, searchEnabled, quoteApi, defaultId, systemCategories, reservedCatalogNames, searchFilters, blueprintSchema]
                properties:
                  roles:
                    type: object
                    required: [seller, customer, admin, orgAdmin]
                    additionalProperties:
                      type: string
                  chat:
                    type: string
                  knowledgeBaseUrl:
                    type: string
                  ticketingUrl:
                    type: string
                  matomoId:
                    type: string
                  matomoUrl:
                    type: string
                  googleTagManagerId:
                    type: string
                  theme:
                    type: string
                  searchEnabled:
                    type: boolean
                  quoteApi:
                    type: string
                  defaultId:
                    type: string
                  systemCategories:
                    type: object
                    additionalProperties:
                      type: string
                  reservedCatalogNames:
                    type: array
                    items:
                      type: string
                  searchFilters:
                    type: object
                    additionalProperties: true
                  blueprintSchema:
                    type: string
                  dspContractDefinitionSchema:
                    type: string
                  siop:
                    type: object
                    description: The login with credentials. `enabled` is false when it is off; when it is on the object also says where the verifier is and how its answer comes back (`isRedirection`, `pollPath`, `pollCertPath`, `clientID`, `callbackURL`, `verifierHost`, `verifierQRCodePath`, `requestUri`).
                    required: [enabled]
                    properties:
                      enabled:
                        type: boolean
                    additionalProperties: true
                additionalProperties: true
              example:
                roles: { seller: Seller, customer: Buyer, admin: admin, orgAdmin: orgAdmin }
                chat: ''
                theme: ''
                searchEnabled: false
                quoteApi: /quote/quoteManagement
                defaultId: urn:ngsi-ld:catalog:default
                systemCategories: { api: 'urn:ngsi-ld:category:api' }
                reservedCatalogNames: [dataset, api, blueprint]
                searchFilters: { primaryCategoriesMode: catalogFirstLevel, primaryRootName: '', filters: [] }
                blueprintSchema: https://schemas.example.org/blueprint.json
                purchaseEnabled: true
  /config/features:
    patch:
      tags: [config]
      operationId: updateFeatureFlags
      summary: Turn some features on or off
      description: |
        For administrators. Each key is the name of a feature as `GET /config` sends it (`purchaseEnabled`, `quotesEnabled`...) and its value a boolean; the ones that are not sent keep what they had. It answers the features that are in force, which are not the ones that were asked for when a feature needs something that is not configured.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
            example:
              quotesEnabled: true
      responses:
        '200':
          description: The features that are in force.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
              example:
                purchaseEnabled: true
                quotesEnabled: true
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/NotAnAdministrator'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /config/filters:
    patch:
      tags: [config]
      operationId: updateSearchFilters
      summary: Save the filters of the search
      description: |
        For administrators. With `primaryCategoriesMode` `catalogFirstLevel` the default filters are kept, whatever else is sent. With `rooted` the filters are checked (a filter is `configured`, with children that have a name and a label, or `categoryRoot`, which takes its values from the children of a root category; only one may be shown in the general information of the offer form) and saved in their normal form. What is wrong is told in the message.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [primaryCategoriesMode, primaryRootName, filters]
              properties:
                primaryCategoriesMode:
                  type: string
                  enum: [catalogFirstLevel, rooted]
                primaryRootName:
                  type: string
                filters:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
            example:
              primaryCategoriesMode: rooted
              primaryRootName: Root
              filters:
                - { name: Type, source: categoryRoot, rootName: Types, offerFormPlacement: none }
      responses:
        '200':
          description: The filters that were saved.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [primaryCategoriesMode, primaryRootName, filters]
                properties:
                  primaryCategoriesMode:
                    type: string
                  primaryRootName:
                    type: string
                  filters:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
              example:
                primaryCategoriesMode: rooted
                primaryRootName: Root
                filters:
                  - { name: Type, source: categoryRoot, rootName: Types, offerFormPlacement: none }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/NotAnAdministrator'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /config/search:
    get:
      tags: [config]
      operationId: getSearchConfig
      summary: The settings of the search engine
      description: |
        For administrators. The address of the search engine, which is the one of the configuration (`upstreams.search`; empty when there is none), and whether the keyword goes in the query of the engine (`?query=`) and not in its path.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The settings.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [searchUrl, useQueryKeyword]
                properties:
                  searchUrl:
                    type: string
                  useQueryKeyword:
                    type: boolean
              example:
                searchUrl: ''
                useQueryKeyword: false
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/NotAnAdministrator'
    patch:
      tags: [config]
      operationId: updateSearchConfig
      summary: Change how the keyword is given to the search engine
      description: |
        For administrators. Both fields are required. The address of the engine is a setting of the deployment: it can be sent back as it is and it is refused (400) when it is another one.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [searchUrl, useQueryKeyword]
              properties:
                searchUrl:
                  type: string
                useQueryKeyword:
                  type: boolean
            example:
              searchUrl: ''
              useQueryKeyword: true
      responses:
        '200':
          description: The settings that are in force.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [searchUrl, useQueryKeyword]
                properties:
                  searchUrl:
                    type: string
                  useQueryKeyword:
                    type: boolean
              example:
                searchUrl: ''
                useQueryKeyword: true
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/NotAnAdministrator'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /admin/catalog/catalog/{id}:
    patch:
      tags: [catalog]
      operationId: updateCatalogAsAdministrator
      summary: Change the name and the description of a catalog
      description: |
        For administrators, who need not be the owner of the catalog: it is how the default catalog, which has no owner, is edited. Only `name` and `description` can be sent. The name is checked as for the owner of a catalog (no characters that are not allowed, not taken by another catalog) and cannot be one of a system category (`API`, `Dataset`...). The other routes under `/admin` are not described here and are answered by the legacy application.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                description:
                  type: string
              additionalProperties: false
            example:
              name: Marketplace
              description: All of it
      responses:
        '200':
          description: The catalog, as the catalog API answers it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: urn:ngsi-ld:catalog:default
                name: Marketplace
        '400':
          $ref: '#/components/responses/InvalidIdOrBody'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/NotAnAdministrator'
        '404':
          description: The catalog does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The required resource does not exist
        '409':
          description: The name is taken by another catalog, or it is reserved to a system category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: This catalog name is reserved
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The name or the description is empty (the name), too long or not a text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: Catalog name is too long, it must be less than 100 characters
        '502':
          description: The catalog, or the catalogs with that name, could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                error: The catalog could not be read
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness
      description: Answers 200 while the process is running. It does not check any dependency.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The process is running.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResult'
              example:
                status: ok
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness
      description: |
        Pings MongoDB and waits at most `health.mongoPingTimeoutMs` for the reply. The state is evaluated on
        every call: it is 503 while MongoDB does not reply and 200 again as soon as it does. From the moment
        a termination signal is received it answers 503 with status `shutting_down`, while the server keeps
        accepting requests for `app.shutdownDelayMs`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: MongoDB replied to the ping.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResult'
              example:
                status: ok
                info:
                  mongodb:
                    status: up
                error: {}
                details:
                  mongodb:
                    status: up
        '503':
          description: MongoDB did not reply to the ping in time, or the connection is closed, or the process is shutting down.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResult'
              examples:
                mongodbDown:
                  summary: MongoDB does not reply
                  value:
                    status: error
                    info: {}
                    error:
                      mongodb:
                        status: down
                        message: MongoDB is not reachable
                    details:
                      mongodb:
                        status: down
                        message: MongoDB is not reachable
                shuttingDown:
                  summary: A termination signal was received
                  value:
                    status: shutting_down
                    info:
                      mongodb:
                        status: up
                    error: {}
                    details:
                      mongodb:
                        status: up
  /document/documentSpecification/{id}:
    get:
      tags: [document]
      operationId: getDocumentSpecification
      summary: Document specification
      description: |
        Reads a document specification from the TMForum document API; the portal uses it to download the content of an
        attachment. The user is identified by the bearer token or the session cookie, and the id is passed to the
        upstream as given once it is known to be an id. Any other method or path under `/document` answers 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The specification, as the TMForum server answers it.
