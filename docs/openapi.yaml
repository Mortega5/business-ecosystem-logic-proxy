    post:
      tags: [catalog]
      operationId: createCategory
      summary: Create a category
      description: |
        Only an administrator. A category is root unless it says it is not (and then it has a parent that exists), has a name, and has a name that no
        other launched category of the same parent has. `id` and `href` are dropped and `validFor` is set to now when it is missing. When the
        marketplace has an operator it is the owner of the category. A root category is added to the default catalog; when there is none yet the
