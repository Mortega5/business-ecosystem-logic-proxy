          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '422':
          description: The product or what it is made of is not valid, or the charging backend refuses it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
