        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
    delete:
      tags: [resource]
      operationId: retireResourceSpecification
      summary: Retire a resource specification
      description: |
        A delete does not remove the specification, it retires it. The same ones that may change it may retire it, and it waits
        until every product specification that uses it is retired or obsolete, as a change of the status does. One that is retired or
        obsolete is not retired again.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The specification retired, as the resource catalog answers it.
          headers:
