      description: |
        A specification that is launched, retired or obsolete is given to anybody, as the details of a product show its resources;
        a draft (active, or with no status) only to a seller who owns it. It is asked for with the identity of the caller when there
        is one. The query is not sent on. Any other method or path under `/resource` answers 404.
