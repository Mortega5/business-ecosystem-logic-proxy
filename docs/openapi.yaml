  /party/organization:
    get:
      tags: [party]
      operationId: listOrganizations
      summary: List of organisations
      description: |
        Open to anybody; it is asked for with the identity of the caller when there is one. Only the filters the portal uses are
        accepted, each once.

        With `lifecycleStatus=Launched` or a `keyword` it is the directory of providers: the organisations that have launched
        offerings. With a search engine the engine finds them, in its order and paged by it. Without one they are the sellers of the
        launched offerings that anybody may read (the ones made for a buyer do not count), without the operator of the marketplace,
        sorted by `tradingName` (or by its reverse with `-tradingName`) and cut into the page that was asked for, so that a page is
        full and `X-Total-Count` is the number of providers. They are kept for five minutes (`limits.providerCacheMs`). Without an
        engine a `keyword` is refused (501), as a list that ignored it would look like its answer.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: fields
          in: query
          required: false
          description: 'Comma-separated fields: letters, digits and the marks _ . @ , -, up to 200 characters.'
          schema:
            type: string
            pattern: '^[A-Za-z0-9_.@,-]{1,200}$'
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: lifecycleStatus
          in: query
          required: false
          description: 'Only `Launched` (in any case): the directory of providers.'
          schema:
            type: string
            enum: [Launched]
        - name: keyword
          in: query
          required: false
          description: 'What the search engine looks for; up to 200 characters, with no `&`, `;` or `#`. It goes in the path of the engine, so a word with a `/`, a `\` or a `..` is refused (400).'
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: '`tradingName` or `-tradingName`.'
          schema:
            type: string
            enum: [tradingName, '-tradingName']
      responses:
        '200':
          description: The organisations, as the party API answers them.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
              example:
                - id: urn:ngsi-ld:organization:1
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '404':
          $ref: '#/components/responses/UpstreamNotFound'
        '501':
          description: A keyword was asked for and the marketplace has no search engine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/UpstreamUnreachable'
