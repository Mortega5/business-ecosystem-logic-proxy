name: Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  docker:
    needs: checks
    uses: ./.github/workflows/docker.yml
    with:
      tag: master
      push: ${{ github.event_name == 'push' }}
    secrets: inherit
