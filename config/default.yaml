app:
  port: 8004
  shutdownTimeoutMs: 20000
  shutdownDelayMs: 0
  https:
    enabled: false

http:
  trustedProxies: []
  bodyLimit: 50mb

logging:
  level: info
  format: pretty
  prettyOptions:
    singleLine: true

features:
  purchaseEnabled: true
  dataSpaceEnabled: false
  catalogManagementEnabled: true
  dspEnabled: false
  quotesEnabled: true
  tenderingEnabled: true
  launchValidationEnabled: false
  tenderDevButtonsOpenCloseEnabled: false

mongo:
  uri: mongodb://localhost:27017/belp
  maxPoolSize: 10
  serverSelectionTimeoutMs: 5000
  heartbeatFrequencyMs: 10000
  retryInitialDelayMs: 1000
  retryMaxDelayMs: 30000

health:
  mongoPingTimeoutMs: 1000

upstreams: {}
