app:
  port: 8004
  shutdownTimeoutMs: 20000
  shutdownDelayMs: 0
  https:
    enabled: false

http:
  trustedProxies: []
  bodyLimit: 5mb
  uploadLimit: 50mb
  cors:
    origins: ["*"]
    exposeRedirect: false

security:
  csp:
    reportOnly: true
  hsts:
    enabled: true
    maxAgeSeconds: 31536000
    includeSubDomains: false
  crossOriginResourcePolicy: same-origin
  csrf:
    enabled: true
    trustedOrigins: []

logging:
  level: info
  format: pretty
  prettyOptions:
    singleLine: true

auth:
  propagateToken: true
  allowLocalEori: false
  roles:
    admin: admin
    customer: Buyer
    seller: Seller
    orgAdmin: orgAdmin
  replacedTokenGraceMs: 30000
  profileTtlMs: 7200000
  refreshMarginSeconds: 5
  defaultTokenLifetimeSeconds: 1800
  idpTimeoutMs: 10000
  idp:
    provider: fiware
    oidcEnabled: true
    tokenAuthMethod: client_secret_basic
  store:
    type: memory
    memoryMaxEntries: 1000
  externalLogin:
    enabled: false
  session:
    maxAgeMs: 86400000
    cookieSecure: auto
    cookieSameSite: lax

purchase:
  enabled: true
  paymentProvider: none

quotes:
  enabled: true
  api: /quote/quoteManagement

tendering:
  enabled: true
  devButtonsOpenClose: false

party:
  editEnabled: true

dome:
  enabled: true

datasets:
  enabled: false

apiAccess:
  enabled: false

blueprints:
  enabled: true

software:
  enabled: true

fileService:
  enabled: false
  url: http://file-service:8081
  # Longest time for one request: the upload of a large file takes a while
  timeoutMs: 1800000
  maxSizeMb: 100
  acceptedTypes: .csv,.json,text/csv,application/json

dsp:
  enabled: false
  # The EDC contract definition (an access policy and a contract policy). v11 gave here the schema of the deployment of software by mistake
  contractDefinitionSchema: https://raw.githubusercontent.com/wistefan/edc-dsc/refs/heads/init/schemas/contract-definition.json

launchValidation:
  enabled: false
  allowUntrustedCertificates: true

search:
  enabled: false

dataSpace:
  enabled: false

catalogManagement:
  enabled: true

catalog:
  offeringSchema: https://raw.githubusercontent.com/DOME-Marketplace/tmf-api/refs/heads/main/DOME/ExternallyBilled.schema.json
  priceCompSchema: https://raw.githubusercontent.com/DOME-Marketplace/tmf-api/refs/heads/main/DOME/PriceComponent.schema.json
  blueprintSchema: https://gist.githubusercontent.com/vramperez/8a16d77f6fc2cdf5fea22dc11b325d52/raw/ad9ef7a1e933cd079732279218609141a731e3b2/blueprint-product-spec.json
  partyLocation: https://raw.githubusercontent.com/DOME-Marketplace/tmf-api/refs/heads/main/schemas/EngagedParty/RelatedParty.schema.json
  defaultCatalogId: ""
  defaultCatalogName: default
  bootstrap:
    enabled: true
    retryDelayMs: 5000
    records:
      defaultCatalog: default
      supportPackageSpec: global
  systemCategories:
    - { key: dataset, name: Dataset, description: Datasets }
    - { key: api, name: API, description: APIs }
    - { key: blueprint, name: Blueprint, description: Blueprints }

mongo:
  uri: mongodb://localhost:27017/belp
  maxPoolSize: 10
  serverSelectionTimeoutMs: 5000
  heartbeatFrequencyMs: 10000
  retryInitialDelayMs: 1000
  retryMaxDelayMs: 30000

limits:
  orderItems: 50
  cartItems: 100
  noteLength: 10000
  notesPerRequest: 20
  nameLength: 100
  descriptionLength: 100000
  plansPerQuery: 20
  providersPerQuery: 50
  providerCacheMs: 300000
  readAll:
    pageSize: 100
    maxPages: 100

portal:
  chatUrl: ""
  knowledgeBaseUrl: ""
  ticketingUrl: ""
  matomoId: ""
  matomoUrl: ""
  googleTagManagerId: ""
  theme: ""
  extra: {}

stats:
  ttlMs: 86400000
  retryDelayMs: 600000
  providerTtlMs: 60000

health:
  mongoPingTimeoutMs: 1000

upstreams:
  timeoutMs: 30000
  tmforum:
    apis:
      catalog: { path: /tmf-api/productCatalogManagement/v4 }
      resource: { path: /tmf-api/resourceCatalog/v4 }
      service: { path: /tmf-api/serviceCatalogManagement/v4 }
      ordering: { path: /tmf-api/productOrderingManagement/v4 }
      inventory: { path: /tmf-api/productInventory/v4 }
      serviceInventory: { path: /tmf-api/serviceInventory/v4 }
      resourceInventory: { path: /tmf-api/resourceInventoryManagement/v4 }
      party: { path: /tmf-api/party/v4 }
      account: { path: /tmf-api/accountManagement/v4 }
      customer: { path: /tmf-api/customerManagement/v4 }
      customerBill: { path: /tmf-api/customerBillManagement/v4 }
      usage: { path: /tmf-api/usageManagement/v4 }
      document: { path: /tmf-api/documentManagement/v4 }
      invoicing: { path: /tmf-api/invoicing/v4 }
      software: { path: /tmf-api/softwareCompute/v4 }
      quote: { path: "" }
  charging: {}
  revenue: { path: /revenue }
  search: {}
